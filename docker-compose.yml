version: '3.8'

services:
  razorshield:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: razorshield-app
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=RazorShield AI
      - APP_VERSION=1.0.0
      - LOW_RISK_THRESHOLD=30
      - MEDIUM_RISK_THRESHOLD=70
      - DEFAULT_AVG_RTO_LOSS=2400.0
      - DEFAULT_VERIFICATION_COST=25.0
      - DEFAULT_MANUAL_REVIEW_COST=65.0
      - DEFAULT_FALSE_POSITIVE_COST=220.0
      - DEFAULT_FALSE_NEGATIVE_COST=2400.0
    volumes:
      - ./data:/app/data
      - ./ml/models:/app/ml/models
    restart: unless-stopped
